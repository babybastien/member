<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASTIEN</title>
    
    <link rel="icon" type="image/png" href="https://img1.pic.in.th/images/cgtlogo2.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Kanit:wght@200;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --primary: #f3d48b;
            --bg-dark: #0a0a0b;
            --card-bg: rgba(20, 20, 25, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #ff4757;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-dark);
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            color: #fff;
            font-family: 'Rajdhani', 'Kanit', sans-serif;
            margin: 0; min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        nav { 
            display: flex; justify-content: space-between; padding: 15px 5%; 
            background: rgba(0,0,0,0.85); align-items: center; position: sticky; 
            top: 0; z-index: 100; backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color);
        }
        #brand-name { font-weight: 900; letter-spacing: 3px; font-family: 'Orbitron'; font-size: 1.4rem; color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

        .glass-panel {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 15px;
            padding: 25px; margin-bottom: 30px;
        }

        input { 
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 12px; 
            color: #fff; border-radius: 8px; font-family: 'Kanit'; outline: none; width: 100%; margin-bottom: 10px;
        }

        .btn-action { 
            background: var(--primary); color: #000; border: none; padding: 12px 25px; 
            border-radius: 8px; font-weight: 700; font-family: 'Orbitron'; cursor: pointer; 
            transition: var(--transition); width: 100%;
        }

        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .member-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; display: flex; align-items: center; gap: 15px; border-radius: 12px; }
        .avatar-box { width: 65px; height: 65px; background-size: cover; background-position: center; border-radius: 50%; border: 2px solid var(--primary); flex-shrink: 0; }
        .role-tag { font-family: 'Orbitron'; font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; background: var(--primary); color: #000; }
    </style>
</head>
<body>

    <nav>
        <div id="brand-name">ORIGINAL BASTIEN</div>
        <div>
            <button onclick="showView('memberView')" class="btn-action" style="width: auto;">HOME</button>
            <button onclick="showView('adminLoginView')" class="btn-action" style="width: auto;">ADMIN</button>
        </div>
    </nav>

    <div class="container">
        <section id="adminLoginView" class="hidden">
            <div style="max-width: 400px; margin: auto;" class="glass-panel">
                <h2 style="text-align:center">ADMIN LOGIN</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button onclick="handleLogin()" class="btn-action">เข้าสู่ระบบ</button>
            </div>
        </section>

        <section id="memberView">
            <div id="adminPanel" class="hidden glass-panel">
                <h3>ระบบจัดการ (Admin Mode)</h3>
                <button onclick="location.reload()" class="btn-action" style="background:#ff4757; color:#fff; width:auto;">LOGOUT</button>
            </div>
            <div class="grid" id="memberGrid"></div>
        </section>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bastienstyle-3d598-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ข้อมูลล็อกอินที่กำหนด
        const ADMIN_USER = "originalbastien";
        const ADMIN_PASS = "1975stylestan";

        function showView(v) {
            document.getElementById('memberView').classList.toggle('hidden', v !== 'memberView');
            document.getElementById('adminLoginView').classList.toggle('hidden', v !== 'adminLoginView');
        }

        function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if(u === ADMIN_USER && p === ADMIN_PASS) {
                document.getElementById('adminPanel').classList.remove('hidden');
                showView('memberView');
                alert("ยินดีต้อนรับท่านแอดมิน");
            } else {
                alert("Username หรือ Password ไม่ถูกต้อง");
            }
        }

        function renderRoster() {
            db.ref('roster').on('value', snap => {
                const grid = document.getElementById('memberGrid');
                grid.innerHTML = "";
                const data = snap.val() || {};
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <div class="avatar-box" style="background-image: url('${item.img || 'https://img2.pic.in.th/10809a679b865d80c09.png'}')"></div>
                        <div>
                            <span class="role-tag">${item.role.toUpperCase()}</span>
                            <div style="font-weight:700;">${item.name}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        renderRoster();
    </script>
</body>
</html>
