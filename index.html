<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">BASTIEN</title>
    <link id="favicon" rel="icon" href="" type="image/x-icon">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --accent: #ffc107;
            --bg: #0d0e12;
            --card-bg: rgba(18, 19, 23, 0.75);
            --admin-card: #16181d;
            --input-bg: #0f1013;
            --border: rgba(255, 255, 255, 0.06);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --danger: #ff4757;
            --success: #2ed573;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { 
            background-color: var(--bg); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: #f5f6fa; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            line-height: 1.6; 
            transition: background 0.5s ease; 
            opacity: 0; 
            animation: fadeInPage 1.2s ease forwards; 
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        
        #weather-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        
        .top-nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            padding: 20px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            background: rgba(13, 14, 18, 0.6); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border); 
        }
        .config-btn { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 10px 24px; 
            border-radius: 30px; 
            font-family: 'Orbitron'; 
            cursor: pointer; 
            transition: var(--transition); 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .config-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.5); 
        }
        
        .hero { padding: 160px 20px 40px; text-align: center; animation: slideIn 1s cubic-bezier(0.22, 1, 0.36, 1); }
        #siteLogo { max-width: 130px; margin-bottom: 20px; filter: drop-shadow(0 0 30px rgba(255,193,7,0.3)); transition: var(--transition); }
        #siteLogo:hover { transform: scale(1.05); }
        .hero h1 { font-family: 'Orbitron'; font-size: clamp(32px, 5vw, 56px); letter-spacing: 12px; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; text-shadow: 0 0 20px rgba(255,193,7,0.2); }
        
        .category-section { max-width: 1400px; margin: 40px auto; padding: 0 5%; }
        .category-header { 
            font-family: 'Orbitron'; 
            font-size: 13px; 
            letter-spacing: 5px; 
            color: var(--accent); 
            margin-bottom: 30px; 
            padding-left: 15px; 
            text-transform: uppercase; 
            position: relative;
        }
        .category-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent);
        }
        
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding-bottom: 40px; z-index: 100; position: relative; }
        .member-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 24px; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            transition: var(--transition); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            animation: slideIn 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) backwards; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .member-card:hover { 
            border-color: rgba(255,255,255,0.15); 
            transform: translateY(-6px) scale(1.02); 
            background: rgba(26, 27, 33, 0.85); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.02);
        }
        
        .avatar { width: 75px; height: 75px; border-radius: 16px; object-fit: cover; border: 2px solid rgba(255,255,255,0.08); transition: var(--transition); }
        .member-card:hover .avatar { transform: rotate(3deg) scale(1.05); border-color: var(--accent); }
        .rank-tag { font-family: 'Orbitron'; font-size: 9px; font-weight: 700; padding: 5px 14px; border-radius: 30px; color: #000; letter-spacing: 1.5px; margin-top: 8px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        
        .social-links { margin-left: auto; display: flex; gap: 14px; font-size: 18px; }
        .social-links a { color: #8a8f9d; transition: var(--transition); opacity: 0.7; }
        .social-links a:hover { transform: translateY(-3px) scale(1.2); opacity: 1; }
        
        .site-footer { padding: 60px 20px; text-align: center; font-family: 'Orbitron'; font-size: 10px; letter-spacing: 3px; opacity: 0.6; border-top: 1px solid var(--border); margin-top: 40px; }
        .site-footer a { color: var(--accent); text-decoration: none; font-weight: 700; transition: var(--transition); }
        .site-footer a:hover { text-shadow: 0 0 10px var(--accent); }
        
        /* Admin UI */
        .admin-panel { display: none; position: fixed; inset: 0; background: #090a0c; z-index: 9999; overflow-y: auto; padding: 50px 20px; }
        .admin-container { max-width: 1200px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .admin-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 30px; }
        .admin-card { background: var(--admin-card); padding: 32px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        
        .col-4 { grid-column: span 4; }
        .col-8 { grid-column: span 8; }
        .col-12 { grid-column: span 12; }
        
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: var(--accent); margin-bottom: 10px; letter-spacing: 1.5px; font-weight: 700; }
        input, select { width: 100%; padding: 16px; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.05); color: #fff; border-radius: 12px; margin-bottom: 24px; font-size: 14px; transition: var(--transition); font-family: 'Inter', sans-serif; }
        input:focus, select:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.02); box-shadow: 0 0 15px rgba(255, 193, 7, 0.1); }
        
        .btn-save { width: 100%; padding: 16px; border: none; border-radius: 12px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700; transition: var(--transition); background: var(--accent); color: #000; letter-spacing: 1px; text-transform: uppercase; font-size: 12px; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 193, 7, 0.3); }
        
        .admin-item-row { background: rgba(255,255,255,0.02); padding: 18px 24px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); transition: var(--transition); }
        .admin-item-row:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); }
        .delete-btn { color: var(--danger); cursor: pointer; padding: 8px; transition: var(--transition); opacity: 0.8; }
        .delete-btn:hover { transform: scale(1.15); opacity: 1; }
        
        /* Notification */
        #notification-container { position: fixed; bottom: 30px; left: 30px; z-index: 10000; }
        .notify { background: #16181d; color: #fff; border-left: 4px solid var(--accent); border-radius: 8px; padding: 16px 28px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 14px; margin-top: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideIn 0.3s ease; }
        
        /* Music Control Button */
        .music-ctrl { position: fixed; bottom: 30px; right: 30px; z-index: 1000; width: 55px; height: 55px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.4); transition: var(--transition); font-size: 16px; }
        .music-ctrl:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 0 30px var(--accent); }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; margin-bottom: 15px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #272930; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #272930; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #32353f; }

        @media (max-width: 992px) { .col-4, .col-8 { grid-column: span 12; } .top-nav { padding: 15px 20px; } }
    </style>
</head>
<body>

    <canvas id="weather-canvas"></canvas>
    <div id="notification-container"></div>
    
    <div class="music-ctrl" onclick="toggleMusic()">
        <i id="musicIcon" class="fa-solid fa-play"></i>
    </div>

    <div id="yt-player-container" style="display:none;"><div id="player"></div></div>

    <div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(5,5,8,0.85); z-index:10000; align-items:center; justify-content:center; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);">
        <div class="admin-card" style="width:100%; max-width:420px; border-color: rgba(255,255,255,0.05);">
            <h2 style="font-family:'Orbitron'; text-align:center; color:var(--accent); margin-bottom:35px; letter-spacing:4px; font-size:22px;">ADMIN LOGIN</h2>
            <label>USERNAME</label><input type="text" id="loginUser" placeholder="Enter username...">
            <label>PASSWORD</label><input type="password" id="loginPass" placeholder="Enter password...">
            <button class="btn-save" onclick="attemptLogin()">ENTER COMMAND</button>
            <button style="width:100%; background:none; border:none; color:#525866; margin-top:20px; cursor:pointer; font-family:'Orbitron'; font-size:11px; letter-spacing:1px; font-weight:700; transition:var(--transition);" onclick="closeModal('loginModal')" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#525866'">CANCEL</button>
        </div>
    </div>

    <nav class="top-nav">
        <div style="font-family:'Orbitron'; font-size:11px; letter-spacing:2px; font-weight:700; display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-users" style="color:var(--accent); font-size:14px;"></i> MEMBER: <span id="countNum" style="color:var(--accent)">0</span>
        </div>
        <button class="config-btn" onclick="openModal('loginModal')"><i class="fa-solid fa-lock" style="margin-right:6px;"></i> ADMIN</button>
    </nav>

    <header class="hero">
        <img src="" id="siteLogo">
        <h1 id="siteNameDisplay">LOADING...</h1>
        <p id="siteDescDisplay" style="font-family:'Orbitron'; font-size:11px; opacity:0.5; letter-spacing:8px; margin-top:5px;">BET FEARLESS IS KING</p>
    </header>

    <div style="max-width:650px; margin:0 auto 50px; padding:0 20px;">
        <div style="position:relative;">
            <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:22px; top:50%; transform:translateY(-50%); color:#525866; font-size:14px;"></i>
            <input type="text" id="memberSearch" placeholder="SEARCH DIRECTORY..." oninput="filterMembers()" style="border-radius:50px; padding: 16px 16px 16px 54px; background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.04); margin-bottom:0;">
        </div>
        <div id="categoryTabs" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:25px;"></div>
    </div>

    <div id="memberSections"></div>

    <footer class="site-footer">
        <span id="footerTextDisplay">ORIGINAL BY BASTIEN 1975</span> | Support by 
        <a id="footerLinkLabel" href="https://www.youtube.com/@bastienboys" target="_blank">BASTIEN</a>
    </footer>

    <div id="adminPanel" class="admin-panel">
        <div class="admin-container">
            <header class="admin-header">
                <div>
                    <h2 style="font-family:'Orbitron'; color:var(--accent); font-size:26px; letter-spacing:2px;">CENTRAL COMMAND</h2>
                    <p style="font-size:12px; color:#525866; margin-top:4px;">Real-time Database & Site Management</p>
                </div>
                <button class="config-btn" style="background:var(--danger); color:#fff; box-shadow:0 4px 15px rgba(255,71,87,0.3);" onclick="closeAdminPanel()">CLOSE</button>
            </header>

            <div class="admin-grid">
                <div class="admin-card col-4">
                    <div style="margin-bottom:25px; font-family:'Orbitron'; font-size:13px; color:var(--accent); border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:12px; letter-spacing:1px; font-weight:700;">SETTING - WEBSITE</div>
                    <label>SITE NAME</label><input type="text" id="configSiteName">
                    <label>FAVICON URL</label><input type="text" id="configFavicon">
                    <label>THEME ACCENT</label><input type="color" id="configThemeColor" style="height:55px; cursor:pointer; padding:5px; background:#111;">
                    <label>LOGO URL</label><input type="text" id="configLogoUrl">
                    <label>WALLPAPER URL</label><input type="text" id="configBgUrl">
                    <label>ATMOSPHERE EFFECT</label>
                    <select id="configWeather">
                        <option value="none">CLEAR</option>
                        <option value="snow">SNOWFLAKES</option>
                        <option value="rain">RAIN SHOWER</option>
                    </select>
                    <label>FOOTER TEXT</label><input type="text" id="configFooterText">
                    <label>FOOTER LINK</label><input type="text" id="configFooterLink">
                    <button class="btn-save" onclick="saveConfig()">SYNC DATABASE</button>
                </div>

                <div class="col-8" style="display:flex; flex-direction:column; gap:30px;">
                    <div class="admin-card">
                        <div style="margin-bottom:20px; font-family:'Orbitron'; font-size:13px; color:var(--accent); font-weight:700; letter-spacing:1px;">ROLE GROUPS</div>
                        <div style="display:flex; gap:15px;">
                            <input type="text" id="newGroupName" placeholder="NEW GROUP (e.g. HIGH COMMAND)" style="margin-bottom:0;">
                            <button class="config-btn" style="border-radius:12px;" onclick="addGroup()">ADD</button>
                        </div>
                        <div id="groupListContainer" style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
                    </div>

                    <div class="admin-card">
                        <div style="margin-bottom:20px; font-family:'Orbitron'; font-size:13px; color:var(--accent); font-weight:700; letter-spacing:1px;">RANK & ROLES</div>
                        <div style="display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:12px;">
                            <input type="text" id="newRoleName" placeholder="ROLE NAME" style="margin-bottom:0;">
                            <select id="roleGroupSelect" style="margin-bottom:0;"></select>
                            <input type="color" id="newRoleColor" value="#ffc107" style="height:50px; margin-bottom:0; padding:4px; background:#111; cursor:pointer; border-radius:12px;">
                            <button class="config-btn" style="border-radius:12px;" onclick="addRole()">ADD</button>
                        </div>
                        <div id="roleListContainer" style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
                    </div>

                    <div class="admin-card">
                        <div style="margin-bottom:20px; font-family:'Orbitron'; font-size:13px; color:var(--accent); font-weight:700; letter-spacing:1px;">AUDIO MUSIC</div>
                        <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                            <label class="switch"><input type="checkbox" id="musicAutoToggle"><span class="slider"></span></label>
                            <span style="font-size:11px; font-family:'Orbitron'; letter-spacing:1px; font-weight:700; color:#8a8f9d;">AUTO-START ON LOAD</span>
                        </div>
                        <div style="display:grid; grid-template-columns: 2fr 1fr auto; gap:15px;">
                            <input type="text" id="musicVidId" placeholder="YOUTUBE VIDEO ID" style="margin-bottom:0;">
                            <input type="number" id="musicStart" placeholder="START (SEC)" style="margin-bottom:0;">
                            <button class="btn-save" onclick="saveMusic()">UPDATE AUDIO</button>
                        </div>
                    </div>
                </div>

                <div class="admin-card col-12">
                    <div style="margin-bottom:25px; font-family:'Orbitron'; font-size:13px; color:var(--accent); border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:12px; font-weight:700; letter-spacing:1px;">ADMIN SETTING - ต้องเลือก Role และใส่ Link Facebook</div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px;">
                        <div><label>FULL NAME</label><input type="text" id="memName"></div>
                        <div><label>AVATAR URL</label><input type="text" id="memImg"></div>
                        <div><label>ASSIGN ROLE</label><select id="memRole"></select></div>
                        <div><label><i class="fa-brands fa-facebook"></i> FB URL (REQUIRED)</label><input type="text" id="memFb"></div>
                        <div><label><i class="fa-brands fa-youtube"></i> YT URL</label><input type="text" id="memYt"></div>
                        <div><label><i class="fa-brands fa-tiktok"></i> TK URL</label><input type="text" id="memTk"></div>
                    </div>
                    <input type="hidden" id="editMemId">
                    <div style="display:flex; gap:15px; margin-top:15px;">
                        <button id="memBtn" class="btn-save" style="flex:3;" onclick="saveMember()">DEPLOY TO DIRECTORY</button>
                        <button class="btn-save" style="flex:1; background:#22242c; color:#fff;" onclick="clearMemForm()">CLEAR FORM</button>
                    </div>
                    <div id="adminMemberList" style="margin-top:35px; display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // อัปเดตลิงก์ฐานข้อมูลแอดเดรสตรงตามที่คุณส่งมาเรียบร้อยครับ
        const firebaseConfig = { 
            databaseURL: "https://bastienstyle-3d598-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player, currentRoles = {}, currentMembers = {}, currentGroups = {}, activeTab = 'all', weatherType = 'none';
        let isPlaying = false;

        function attemptLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            
            // ใช้รหัสผ่าน admin / 1975style
            if(u === 'admin' && p === '1975style') {
                closeModal('loginModal'); 
                document.getElementById('adminPanel').style.display = 'block';
                document.body.style.overflow = 'hidden';
                loadConfigToInputs();
            } else showNotify("ACCESS DENIED: WRONG CREDENTIALS");
        }

        function showNotify(msg) {
            const container = document.getElementById('notification-container');
            const el = document.createElement('div');
            el.className = 'notify';
            el.innerHTML = `<i class="fa-solid fa-bell" style="color:var(--accent)"></i> ${msg}`;
            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function loadConfigToInputs() {
            db.ref('config').once('value', snap => {
                const d = snap.val() || {};
                document.getElementById('configSiteName').value = d.name || '';
                document.getElementById('configFavicon').value = d.favicon || '';
                document.getElementById('configThemeColor').value = d.themeColor || '#ffc107';
                document.getElementById('configLogoUrl').value = d.logo || '';
                document.getElementById('configBgUrl').value = d.bgUrl || '';
                document.getElementById('configWeather').value = d.weather || 'none';
                document.getElementById('configFooterText').value = d.footerText || '';
                document.getElementById('configFooterLink').value = d.footerLink || '';
            });
            db.ref('music').once('value', snap => {
                const m = snap.val() || {};
                document.getElementById('musicVidId').value = m.id || '';
                document.getElementById('musicStart').value = m.start || 0;
                document.getElementById('musicAutoToggle').checked = m.auto || false;
            });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeAdminPanel() { 
            document.getElementById('adminPanel').style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
        }

        db.ref('roleGroups').on('value', snap => {
            currentGroups = snap.val() || {};
            let list = '', opt = '<option value="">SELECT GROUP</option>';
            Object.keys(currentGroups).forEach(id => {
                list += `<div class="admin-item-row"><span>${currentGroups[id].name}</span><i class="fa-solid fa-trash-can delete-btn" onclick="db.ref('roleGroups').child('${id}').remove()"></i></div>`;
                opt += `<option value="${id}">${currentGroups[id].name}</option>`;
            });
            document.getElementById('groupListContainer').innerHTML = list;
            document.getElementById('roleGroupSelect').innerHTML = opt;
            filterMembers();
        });

        db.ref('roles').on('value', snap => {
            currentRoles = snap.val() || {};
            let opt = '<option value="">SELECT ROLE</option>', list = '';
            Object.keys(currentRoles).forEach(id => {
                const gName = currentGroups[currentRoles[id].groupId]?.name || 'UNKNOWN';
                opt += `<option value="${id}">${currentRoles[id].name}</option>`;
                list += `<div class="admin-item-row"><div><b style="color:${currentRoles[id].color}">${currentRoles[id].name}</b><br><small style="color:#525866">${gName}</small></div><i class="fa-solid fa-trash-can delete-btn" onclick="db.ref('roles').child('${id}').remove()"></i></div>`;
            });
            document.getElementById('memRole').innerHTML = opt;
            document.getElementById('roleListContainer').innerHTML = list;
            renderTabs(); filterMembers();
        });

        db.ref('members').on('value', snap => {
            currentMembers = snap.val() || {};
            // อัปเดตนับจำนวนสมาชิกจริงแบบ Realtime
            document.getElementById('countNum').innerText = Object.keys(currentMembers).length;
            let adminList = '';
            Object.keys(currentMembers).forEach(id => {
                adminList += `<div class="admin-item-row"><span>${currentMembers[id].name}</span><div><i class="fa-solid fa-pen-to-square" style="color:var(--accent); cursor:pointer; margin-right:15px;" onclick="editMember('${id}')"></i><i class="fa-solid fa-trash-can delete-btn" onclick="db.ref('members').child('${id}').remove()"></i></div></div>`;
            });
            document.getElementById('adminMemberList').innerHTML = adminList;
            filterMembers();
        });

        function addGroup() {
            const name = document.getElementById('newGroupName').value.toUpperCase();
            if(name) db.ref('roleGroups').push({ name }).then(() => {
                document.getElementById('newGroupName').value = ''; showNotify("GROUP ADDED");
            });
        }

        function addRole() {
            const name = document.getElementById('newRoleName').value.toUpperCase();
            const gId = document.getElementById('roleGroupSelect').value;
            const color = document.getElementById('newRoleColor').value;
            if(name && gId) db.ref('roles').push({ name, groupId: gId, color }).then(() => {
                document.getElementById('newRoleName').value = ''; showNotify("ROLE CREATED");
            });
        }

        function saveMember() {
            const id = document.getElementById('editMemId').value;
            const data = {
                name: document.getElementById('memName').value,
                img: document.getElementById('memImg').value,
                roleId: document.getElementById('memRole').value,
                fb: document.getElementById('memFb').value || "",
                yt: document.getElementById('memYt').value || "",
                tk: document.getElementById('memTk').value || ""
            };

            if(!data.name || !data.roleId) return showNotify("ERROR: NAME & ROLE REQUIRED");
            if(!data.fb) return showNotify("ERROR: FACEBOOK LINK IS REQUIRED TO ADD MEMBER");

            const ref = id ? db.ref('members').child(id) : db.ref('members').push();
            ref.set(data).then(() => { 
                showNotify("PERSONNEL DATABASE UPDATED"); 
                clearMemForm(); 
            });
        }

        function editMember(id) {
            const m = currentMembers[id];
            document.getElementById('editMemId').value = id;
            document.getElementById('memName').value = m.name;
            document.getElementById('memImg').value = m.img;
            document.getElementById('memRole').value = m.roleId;
            document.getElementById('memFb').value = m.fb;
            document.getElementById('memYt').value = m.yt;
            document.getElementById('memTk').value = m.tk;
            document.getElementById('memBtn').innerText = "UPDATE PERSONNEL INFO";
            document.getElementById('memBtn').style.background = "var(--success)";
        }

        function clearMemForm() {
            document.getElementById('editMemId').value = '';
            document.getElementById('memName').value = '';
            document.getElementById('memImg').value = '';
            document.getElementById('memFb').value = '';
            document.getElementById('memYt').value = '';
            document.getElementById('memTk').value = '';
            document.getElementById('memBtn').innerText = "DEPLOY TO DIRECTORY";
            document.getElementById('memBtn').style.background = "var(--accent)";
        }

        // ลบระบบล็อกหัวข้อ Founder ออกแล้ว และผูกระบบเข้ากับช่องเสิร์ชจริง
        function filterMembers() {
            const term = document.getElementById('memberSearch').value.toLowerCase();
            const wrapper = document.getElementById('memberSections');
            wrapper.innerHTML = '';
            const structure = {};
            
            Object.keys(currentMembers).forEach(id => {
                const m = currentMembers[id];
                const role = currentRoles[m.roleId];
                if(!role) return;
                const gId = role.groupId;
                const gName = currentGroups[gId]?.name || "COMMUNITY MEMBER";
                
                // ค้นหาตามรายชื่อและกรองตามปุ่มแท็บหมวดหมู่
                if(m.name.toLowerCase().includes(term) && (activeTab === 'all' || m.roleId === activeTab)) {
                    if(!structure[gId]) structure[gId] = { name: gName, items: [] };
                    structure[gId].items.push({...m, role});
                }
            });

            Object.keys(structure).forEach(gId => {
                const group = structure[gId];
                let html = `<section class="category-section"><div class="category-header">${group.name}</div><div class="member-grid">`;
                group.items.forEach((m, i) => {
                    html += `
                        <div class="member-card" style="animation-delay:${i*0.05}s">
                            <img src="${m.img || 'https://via.placeholder.com/70'}" class="avatar">
                            <div>
                                <div style="font-weight:600; font-size:15px; letter-spacing:0.5px;">${m.name}</div>
                                <span class="rank-tag" style="background:${m.role.color}">${m.role.name}</span>
                            </div>
                            <div class="social-links">
                                ${m.fb ? `<a href="${m.fb}" target="_blank" style="color:#1877f2;"><i class="fa-brands fa-facebook"></i></a>` : ''}
                                ${m.yt ? `<a href="${m.yt}" target="_blank" style="color:#ff0000;"><i class="fa-brands fa-youtube"></i></a>` : ''}
                                ${m.tk ? `<a href="${m.tk}" target="_blank" style="color:#fff;"><i class="fa-brands fa-tiktok"></i></a>` : ''}
                            </div>
                        </div>`;
                });
                html += `</div></section>`;
                wrapper.innerHTML += html;
            });
            if(!Object.keys(structure).length) wrapper.innerHTML = '<p style="text-align:center; opacity:0.3; padding:100px; font-family:\'Orbitron\'; font-size:12px; letter-spacing:2px;">NO RECORDS FOUND</p>';
        }
