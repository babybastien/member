<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASTIENSTYLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; }
        body{ background:#050505; color:white; min-height:100vh; overflow-x:hidden; }
        body::before{ content:''; position:fixed; inset:0; background: radial-gradient(circle at top,#3f0069 0%,transparent 40%), radial-gradient(circle at bottom,#000000 0%,#050505 60%); z-index:-1; }
        .container{ width:90%; max-width:1400px; margin:auto; padding:40px 0; }
        .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; }
        .logo h1{ font-size:60px; font-weight:900; letter-spacing:2px; }
        .search-box{ width:320px; }
        .search-box input{ width:100%; padding:15px; background:#111; border:1px solid #222; color:white; border-radius:12px; outline:none; }
        .section-title{ margin-top:40px; margin-bottom:20px; font-size:14px; font-weight:800; letter-spacing:5px; }
        .leader-title{ color:#ff3b3b; }
        .member-title{ color:#8f6bff; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
        .card{ background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); backdrop-filter:blur(10px); border-radius:18px; padding:18px; display:flex; align-items:center; justify-content:space-between; transition:.3s; }
        .card:hover{ transform:translateY(-5px); border-color:#8f6bff; }
        .left{ display:flex; align-items:center; gap:15px; }
        .avatar{ width:65px; height:65px; border-radius:50%; object-fit:cover; border:2px solid #8f6bff; }
        .info h3{ font-size:17px; }
        .rank{ font-size:12px; opacity:.7; margin-top:4px; }
        .actions{ display:flex; gap:10px; }
        .actions a{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:#111; border-radius:50%; text-decoration:none; color:white; cursor:pointer; }
        .admin-btn{ position:fixed; bottom:30px; right:30px; width:65px; height:65px; border:none; border-radius:50%; background:#8f6bff; color:white; font-size:22px; cursor:pointer; }
        .modal{ position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:999; }
        .modal-content{ width:95%; max-width:600px; background:#0d0d0d; border:1px solid #222; border-radius:20px; padding:30px; }
        .modal-content h2{ margin-bottom:20px; }
        .modal-content input, .modal-content select{ width:100%; padding:14px; margin-bottom:15px; background:#111; border:1px solid #222; color:white; border-radius:10px; }
        .saveBtn{ width:100%; padding:15px; background:#8f6bff; border:none; color:white; font-weight:700; cursor:pointer; border-radius:10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <h1>BASTIENSTYLE</h1>
            <div id="memberCount">0 MEMBERS</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Member...">
        </div>
    </div>
    <div class="section-title leader-title">LEADER</div>
    <div class="grid" id="leaderContainer"></div>
    <div class="section-title member-title">MEMBER</div>
    <div class="grid" id="memberContainer"></div>
</div>

<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="modal" id="loginModal">
    <div class="modal-content">
        <h2>ADMIN LOGIN</h2>
        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <button class="saveBtn" onclick="loginAdmin()">LOGIN</button>
    </div>
</div>

<div class="modal" id="adminModal">
    <div class="modal-content">
        <h2>ADMIN PANEL</h2>
        <input type="text" id="memberName" placeholder="Member Name">
        <select id="memberRank">
            <option value="LEADER">LEADER</option>
            <option value="MEMBER">MEMBER</option>
        </select>
        <input type="text" id="memberFacebook" placeholder="Facebook Link">
        <button class="saveBtn" onclick="saveMember()">SAVE MEMBER</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "https://bastienstyle-3d598-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bastienstyle-3d598",
        storageBucket: "bastienstyle-3d598.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const DEFAULT_AVATAR = "https://img2.pic.in.th/108517da8a8289df682.png";
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "1975";
    let isAdmin = false;
    let editId = null;

    window.openAdmin = () => {
        if(!isAdmin) document.getElementById("loginModal").style.display = "flex";
        else document.getElementById("adminModal").style.display = "flex";
    };

    window.loginAdmin = () => {
        if(document.getElementById("adminUser").value === ADMIN_USER && document.getElementById("adminPass").value === ADMIN_PASS){
            isAdmin = true;
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminModal").style.display = "flex";
        } else { alert("INVALID"); }
    };

    window.onclick = (e) => {
        if(e.target.className === 'modal') e.target.style.display = "none";
    };

    const createCard = (id, data) => `
        <div class="card">
            <div class="left">
                <img class="avatar" src="${data.avatar || DEFAULT_AVATAR}">
                <div class="info"><h3>${data.name}</h3><div class="rank">${data.rank}</div></div>
            </div>
            <div class="actions">
                <a href="${data.facebook}" target="_blank">f</a>
                <a onclick="editMember('${id}')">✏</a>
                <a onclick="deleteMember('${id}')">🗑</a>
            </div>
        </div>`;

    onValue(ref(db, "members"), (snapshot) => {
        const leaderContainer = document.getElementById("leaderContainer");
        const memberContainer = document.getElementById("memberContainer");
        leaderContainer.innerHTML = "";
        memberContainer.innerHTML = "";
        let total = 0;
        snapshot.forEach((child) => {
            total++;
            const data = child.val();
            if(data.rank === "LEADER") leaderContainer.innerHTML += createCard(child.key, data);
            else memberContainer.innerHTML += createCard(child.key, data);
        });
        document.getElementById("memberCount").innerHTML = `${total} MEMBERS`;
    });

    window.saveMember = async () => {
        const data = { name: document.getElementById("memberName").value, rank: document.getElementById("memberRank").value, facebook: document.getElementById("memberFacebook").value, avatar: DEFAULT_AVATAR };
        if(editId) await update(ref(db, "members/" + editId), data);
        else await push(ref(db, "members"), data);
        document.getElementById("adminModal").style.display = "none";
        editId = null;
    };

    window.deleteMember = async (id) => { if(confirm("Delete?")) await remove(ref(db, "members/" + id)); };
    window.editMember = (id) => {
        onValue(ref(db, "members/" + id), (snapshot) => {
            const data = snapshot.val();
            editId = id;
            document.getElementById("memberName").value = data.name;
            document.getElementById("memberRank").value = data.rank;
            document.getElementById("memberFacebook").value = data.facebook;
            document.getElementById("adminModal").style.display = "flex";
        }, { onlyOnce: true });
    };
</script>
</body>
</html>
