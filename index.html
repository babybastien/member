<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASTIEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; }
        body { background:radial-gradient(circle at top,#5b21b6 0%,#0a0a0a 35%,#000 100%); color:white; min-height:100vh; overflow-x:hidden; }
        .container { width:90%; max-width:1400px; margin:auto; padding:50px 0; }
        .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; margin-bottom:50px; }
        .logo h1 { font-size:70px; font-weight:900; letter-spacing:4px; background:linear-gradient(90deg,#ffffff,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .total-member { margin-top:10px; font-size:18px; letter-spacing:2px; color:#cfcfcf; }
        .total-member span { font-size:42px; font-weight:900; color:#fff; }
        .search-box input { width:320px; padding:15px 20px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:14px; color:white; outline:none; font-size:15px; backdrop-filter:blur(10px); }
        .section { margin-bottom:60px; }
        .section-title { display:flex; align-items:center; gap:15px; margin-bottom:25px; font-size:22px; font-weight:800; letter-spacing:4px; }
        .section-title::after { content:''; flex:1; height:2px; background:linear-gradient(90deg,currentColor,transparent); }
        .leader { color:#f59e0b; }
        .member { color:#22c55e; }
        
        /* Updated Grid */
        .member-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        @media(max-width:1100px) { .member-grid { grid-template-columns:repeat(2,1fr); } }
        @media(max-width:768px) { .member-grid { grid-template-columns:1fr; .logo h1 { font-size:42px; } .search-box input { width:100%; } } }

        .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:20px; display:flex; align-items:center; justify-content:space-between; backdrop-filter:blur(12px); transition:.3s; }
        .card:hover { transform:translateY(-5px); border-color:#a855f7; box-shadow:0 0 30px rgba(168,85,247,.25); }
        .left { display:flex; align-items:center; gap:15px; }
        .avatar { width:65px; height:65px; border-radius:50%; background:linear-gradient(135deg,#a855f7,#7c3aed); display:flex; justify-content:center; align-items:center; font-size:24px; font-weight:800; }
        .info h3 { font-size:18px; margin-bottom:5px; }
        .role { font-size:12px; letter-spacing:2px; color:#aaa; }
        .fb-btn { width:48px; height:48px; border-radius:50%; display:flex; justify-content:center; align-items:center; background:#1877f2; color:white; text-decoration:none; font-size:20px; transition:.3s; }
        .fb-btn:hover { transform:scale(1.1); }
        .no-result { text-align:center; padding:50px; font-size:20px; display:none; }
        .footer { text-align:center; padding:50px 0; color:#777; font-size:13px; letter-spacing:2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <h1>BASTIEN</h1>
            <div class="total-member"><span id="totalMembers">0</span> MEMBERS</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search member...">
        </div>
    </div>

    <div class="section">
        <div class="section-title leader">LEADER</div>
        <div class="member-grid" id="leaderGrid">
            </div>
    </div>

    <div class="section">
        <div class="section-title member">MEMBER</div>
        <div class="member-grid" id="memberGrid">
            </div>
    </div>

    <div class="no-result" id="noResult">No members found</div>
    <div class="footer">BASTIEN COMMUNITY © 2026</div>
</div>

<div id="adminPanel" style="display:none; position:fixed; top:20px; right:20px; width:300px; background:#111; padding:20px; border-radius:15px; border:1px solid #333; z-index:99999;">
    <h3 style="margin-bottom:15px;">ADMIN PANEL</h3>
    <input id="memberName" placeholder="Name" style="width:100%; padding:10px; margin-bottom:10px; color:#000;">
    <select id="memberRole" style="width:100%; padding:10px; margin-bottom:10px; color:#000;">
        <option value="LEADER">LEADER</option>
        <option value="MEMBER">MEMBER</option>
    </select>
    <input id="memberFacebook" placeholder="Facebook URL" style="width:100%; padding:10px; margin-bottom:10px; color:#000;">
    <button onclick="addMember()" style="width:100%; padding:12px; cursor:pointer; background:#a855f7; border:none; color:white; font-weight:bold;">ADD MEMBER</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getDatabase } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD_z-9EtXA4ZtQLArrP7Nl0QdyMDPLpIIE",
        authDomain: "bastienstyle-3d598.firebaseapp.com",
        databaseURL: "https://bastienstyle-3d598-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bastienstyle-3d598",
        storageBucket: "bastienstyle-3d598.firebasestorage.app",
        messagingSenderId: "221095358019",
        appId: "1:221095358019:web:7fd4e129363599eb05aef6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;
</script>

<script>
    function updateTotal() {
        const cards = document.querySelectorAll('.member-card');
        document.getElementById('totalMembers').textContent = cards.length;
    }

    // Search Logic
    document.getElementById('searchInput').addEventListener('keyup', function() {
        let value = this.value.toLowerCase();
        let found = false;
        document.querySelectorAll('.member-card').forEach(card => {
            let name = card.querySelector('h3').textContent.toLowerCase();
            if(name.includes(value)) { card.style.display = 'flex'; found = true; }
            else { card.style.display = 'none'; }
        });
        document.getElementById('noResult').style.display = found ? 'none' : 'block';
    });

    // Admin Access
    const adminUser = prompt("Username");
    const adminPass = adminUser ? prompt("Password") : null;
    if(adminUser === "admin" && adminPass === "1975style") {
        document.getElementById("adminPanel").style.display = "block";
    }

    function addMember() {
        const name = document.getElementById("memberName").value;
        const role = document.getElementById("memberRole").value;
        const fb = document.getElementById("memberFacebook").value;
        if(!name) return;
        const letter = name.charAt(0).toUpperCase();
        const target = role === "LEADER" ? document.getElementById("leaderGrid") : document.getElementById("memberGrid");
        
        target.insertAdjacentHTML("beforeend", `
            <div class="card member-card">
                <div class="left">
                    <div class="avatar">${letter}</div>
                    <div class="info"><h3>${name}</h3><div class="role">${role}</div></div>
                </div>
                <a class="fb-btn" href="${fb}" target="_blank">f</a>
            </div>
        `);
        updateTotal();
    }
    
    updateTotal();
</script>

</body>
</html>
